<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaedf1" />
    <script>
      // Apply the preference before styles/React paint; storage may be unavailable.
      (() => {
        let mode = 'system';
        let palette = 'sber-business';
        try { mode = localStorage.getItem('cofounder.theme.v1') || 'system'; } catch {}
        try {
          const saved = localStorage.getItem('cofounder.palette.v1');
          if (['sber', 'sber-business', 'plasma', 'giga', 'iris'].includes(saved)) palette = saved;
        } catch {}
        const dark = mode === 'dark' || (mode !== 'light' && mode !== 'dark' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.palette = palette;
        document.addEventListener('DOMContentLoaded', () => {
          const canvas = getComputedStyle(document.documentElement).getPropertyValue('--ds-canvas').trim();
          if (canvas) document.querySelector('meta[name="theme-color"]').content = canvas;
        }, { once: true });
      })();
    </script>
    <meta name="description" content="CoFounder — мастерская вашей идеи: от первого вопроса до описания MVP." />
    <link id="app-favicon" rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=cofounder-20261116" />
    <title>CoFounder — мастерская стартапа</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
